<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Scanner Toyota</title>
    <style>
        :root {
            --primary-color: #1e3a8a;
            --primary-light: #3b82f6;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
            --hover-row: #f1f5f9;
            --badge-toyota: #0284c7;
            --badge-obd: #059669;
            --badge-calc: #d97706;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 24px;
            text-align: center;
        }

        h1 {
            font-size: 1.8rem;
            color: var(--primary-color);
            margin-bottom: 8px;
        }

        p.subtitle {
            font-size: 0.95rem;
            color: #64748b;
        }

        .search-box {
            position: sticky;
            top: 10px;
            z-index: 10;
            background: var(--bg-color);
            padding: 10px 0;
            margin-bottom: 20px;
        }

        .search-input-wrapper {
            position: relative;
            max-width: 600px;
            margin: 0 auto;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px 20px 14px 45px;
            font-size: 1rem;
            border: 2px solid var(--primary-light);
            border-radius: 12px;
            outline: none;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: all 0.2s ease;
            background: white;
        }

        input[type="text"]:focus {
            border-color: var(--primary-color);
            box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.25);
        }

        .search-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.2rem;
            color: #94a3b8;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 600px;
            margin: 10px auto 0;
            font-size: 0.85rem;
            color: #64748b;
        }

        .table-container {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        thead {
            background-color: var(--primary-color);
            color: white;
        }

        th, td {
            padding: 14px 18px;
            font-size: 0.95rem;
        }

        th {
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 0.05em;
        }

        tbody tr {
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: background-color 0.15s ease;
        }

        tbody tr:hover {
            background-color: var(--hover-row);
        }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            color: white;
        }

        .badge-toyota { background-color: var(--badge-toyota); }
        .badge-obd { background-color: var(--badge-obd); }
        .badge-calc { background-color: var(--badge-calc); }

        .source-badge {
            display:inline-flex; align-items:center; gap:5px; padding:4px 8px;
            border-radius:999px; font-size:.72rem; font-weight:700; white-space:nowrap;
        }
        .source-car { background:#e0f2fe; color:#075985; border:1px solid #bae6fd; }
        .source-calc { background:#fff7ed; color:#9a3412; border:1px solid #fed7aa; }
        .legend { max-width:1000px; margin:0 auto 14px; display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
        .diagram-card { max-width:1000px; margin:0 auto 18px; background:#fff; border:1px solid var(--border-color); border-radius:12px; padding:14px 16px; box-shadow:0 2px 5px rgba(15,23,42,.04); }
        .diagram-title { font-size:.82rem; text-transform:uppercase; letter-spacing:.05em; color:#64748b; font-weight:700; margin-bottom:8px; }
        .diagram-card svg { display:block; width:100%; height:auto; max-height:210px; }
        .sensor-name-row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
        .info.long { line-height:1.6; }
        .info.long .detail { margin-top:7px; color:#475569; }

        /* Modal / Pop-up Styles */
        .modal-backdrop {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: white;
            border-radius: 16px;
            max-width: 550px;
            width: 100%;
            padding: 28px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
            position: relative;
            animation: modalFadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes modalFadeIn {
            from { opacity: 0; transform: scale(0.95) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .close-btn {
            position: absolute;
            top: 18px;
            right: 20px;
            font-size: 1.5rem;
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            line-height: 1;
        }

        .close-btn:hover {
            color: var(--text-color);
        }

        .modal-header {
            margin-bottom: 16px;
            padding-right: 24px;
        }

        .modal-title {
            font-size: 1.3rem;
            color: var(--primary-color);
            margin-bottom: 8px;
        }

        .modal-body-section {
            margin-bottom: 16px;
        }

        .modal-label {
            font-weight: 600;
            font-size: 0.8rem;
            text-transform: uppercase;
            color: #64748b;
            margin-bottom: 4px;
        }

        .modal-value {
            font-size: 0.95rem;
            line-height: 1.5;
            color: #334155;
        }

        .expected-box {
            background-color: #f0fdf4;
            border-left: 4px solid #16a34a;
            padding: 12px;
            border-radius: 6px;
            margin-top: 12px;
        }

        .expected-title {
            color: #15803d;
            font-weight: 600;
            font-size: 0.85rem;
            margin-bottom: 2px;
        }

        .no-results {
            text-align: center;
            padding: 40px;
            color: #94a3b8;
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>Sensores y PIDs</h1>
    </header>

    <div class="search-box">
        <div class="search-input-wrapper">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" placeholder="Busca por nombre, SOC, batería, EV, RPM, OBD, temperatura, presión..." autofocus>
        </div>
        <div class="stats-bar">
    
            <span id="sensorCount">Mostrando: 0 sensores</span>
        </div>
    </div>

    <div class="filter-panel" aria-label="Filtros de sensores">
     
        <div class="filter-row">
            <span class="filter-label">Tipo de sensor</span>
            <div class="filter-buttons" id="categoryFilters"></div>
        </div>
        <div class="active-filters" id="activeFilters"></div>
    </div>

<style>
/* Inline-search upgrade */

.filter-panel {
  max-width: 1000px; margin: 0 auto 18px; padding: 12px;
  background:#fff; border:1px solid var(--border-color); border-radius:12px;
  box-shadow:0 2px 5px rgba(15,23,42,.04);
}
.filter-row { display:flex; gap:12px; align-items:flex-start; }
.filter-row + .filter-row { margin-top:10px; padding-top:10px; border-top:1px solid var(--border-color); }
.filter-label {
  flex:0 0 105px; padding-top:7px; font-size:.72rem; text-transform:uppercase;
  letter-spacing:.05em; color:#64748b; font-weight:700;
}
.filter-buttons { display:flex; gap:7px; flex-wrap:wrap; }
.filter-btn {
  appearance:none; border:1px solid #cbd5e1; background:#f8fafc; color:#334155;
  border-radius:999px; padding:7px 11px; font-size:.82rem; font-weight:600;
  cursor:pointer; transition:all .15s ease;
}
.filter-btn:hover { border-color:var(--primary-light); background:#eff6ff; }
.filter-btn.active { background:var(--primary-color); border-color:var(--primary-color); color:#fff; }
.active-filters { display:none; margin-top:10px; font-size:.78rem; color:#475569; }
.active-filters.visible { display:block; }

  .filter-row { display:block; }
  .filter-label { display:block; margin-bottom:7px; }
}

.results { display:grid; gap:10px; margin-top:16px; }
.sensor-card {
  background:#fff; border:1px solid var(--border-color); border-radius:12px;
  padding:15px 17px; box-shadow:0 2px 5px rgba(15,23,42,.04);
}
.sensor-head { display:flex; gap:10px; align-items:flex-start; justify-content:space-between; }
.sensor-name { font-weight:700; color:var(--primary-color); font-size:1rem; word-break:break-word; }
.meta { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
.chip { border-radius:999px; padding:3px 8px; font-size:.72rem; background:#eef2ff; color:#334155; }
.chip.origin { background:#e0f2fe; color:#075985; }
.chip.unit { background:#ecfdf5; color:#166534; }
.chip.priority { background:#fff7ed; color:#9a3412; }
.sensor-grid { display:grid; grid-template-columns:1.25fr 1fr; gap:12px; margin-top:12px; }
.info-title {font-size:.72rem; text-transform:uppercase; letter-spacing:.05em; color:#64748b; font-weight:700; margin-bottom:4px;}
.info {font-size:.9rem; line-height:1.45; color:#334155;}
.advice { margin-top:10px; background:#f8fafc; border-left:4px solid var(--primary-light); padding:9px 11px; border-radius:6px; }
.range {font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:.82rem; color:#0f172a;}
@media(max-width:760px){.sensor-grid{grid-template-columns:1fr}.sensor-head{display:block}.meta{margin-bottom:4px}}
</style>

: "En un Corolla de tracción delantera puede no ser relevante o permanecer fija.", "advice": "Indicador numérico; no incluir en el cuadro principal si no cambia.", "min": 0, "max": 100, "priority": "Opcional"}, {"name": "[OBD] Carga calculada del motor (Calculated Engine Load)", "origin": "OBDII / Car Scanner", "unit": "%", "cat": "Carga del motor", "desc": "PID estándar de carga calculada reportada por la ECU.", "ref": "Ralentí y carga parcial suelen ser bajos; a plena carga se acerca al máximo.", "advice": "Barra/semicírculo 0–100%.", "min": 0, "max": 100, "priority": "OBD"}, {"name": "Potencia instantánea del motor (basada en el consumo de combustible)", "origin": "Calculado/Car Scanner", "unit": "hp", "cat": "Potencia térmica calculada", "desc": "Estimación de potencia basada en consumo de combustible.", "ref": "Es una estimación de Car Scanner, no una medición directa.", "advice": "Gráfico de línea 0–120 hp inicialmente.", "min": 0, "max": 120, "priority": "Calculado"}, {"name": "Power from MAF", "origin": "OBDII / Car Scanner", "unit": "hp", "cat": "Potencia calculada", "desc": "Potencia estimada a partir del flujo de aire MAF.", "ref": "Es una estimación, no una medición directa de potencia en ruedas.", "advice": "Gráfico de línea; 0–150 hp inicialmente.", "min": 0, "max": 150, "priority": "OBD"}, {"name": "Purgado evaporativo ordenado", "origin": "OBDII / Car Scanner", "unit": "%", "cat": "Emisiones", "desc": "Porcentaje de purga de vapores de combustible ordenado por la ECU.", "ref": "Puede ser 0% en muchos momentos y subir con condiciones apropiadas.", "advice": "Barra 0–100%.", "min": 0, "max": 100, "priority": "OBD"}, {"name": "Sensor de oxígeno 2 Banco 1 Ajuste de combustible a corto plazo", "origin": "OBDII / Car Scanner", "unit": "%", "cat": "Escape / mezcla", "desc": "Corrección asociada al sensor O2 B1S2 si el PID la proporciona.", "ref": "Interpretar con cautela; no todos los vehículos usan este valor de la misma manera.", "advice": "Gráfico bipolar -25…25%.", "min": -25, "max": 25, "priority": "OBD"}];

        const searchInput = document.getElementById('searchInput');
        const results = document.getElementById('results');
        const sensorCount = document.getElementById('sensorCount');
        const noResults = document.getElementById('noResults');
        const categoryFilters = document.getElementById('categoryFilters');
        const activeFilters = document.getElementById('activeFilters');

        let activeOriginFilter = 'all';
        let activeCategoryFilter = 'all';

        function normalize(v) {
            return String(v ?? '')
                .toLocaleLowerCase('es')
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '');
        }

        function esc(v) {
            return String(v ?? '').replace(/[&<>"']/g, c => ({
                '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
            }[c]));
        }

        function rangeText(s) {
            if (s.min == null && s.max == null) return 'Sin escala numérica fija';
            if (s.min == null) return `máx. ${s.max} ${s.unit}`;
            if (s.max == null) return `mín. ${s.min} ${s.unit}`;
            return `${s.min} – ${s.max} ${s.unit}`;
        }

        function isObdBasic(s) {
            return normalize(s.origin).includes('obdii / car scanner') ||
                   normalize(s.priority) === 'obd';
        }

        // Perfil Activo: todo lo que no pertenece al bloque OBD básico.
        function isActiveProfile(s) {
            return !isObdBasic(s);
        }

        function render(data) {
            results.innerHTML = data.map(s => `
              <article class="sensor-card">
                <div class="sensor-head">
                  <div>
                    <div class="sensor-name-row">
                      <div class="sensor-name">${esc(s.name)}</div>
                      <span class="source-badge ${normalize(s.origin).includes('calculado') ? 'source-calc' : 'source-car'}">${normalize(s.origin).includes('calculado') ? '🧮 Calculado' : '🚗 Valor del coche'}</span>
                    </div>
                    <div class="meta">
                      <span class="chip origin">${esc(s.origin)}</span>
                      <span class="chip unit">${esc(s.unit)}</span>
                      <span class="chip">${esc(s.cat)}</span>
                      <span class="chip priority">${esc(s.priority)}</span>
                    </div>
                  </div>
                </div>
                <div class="sensor-grid">
                  <div>
                    <div class="info-title">Qué mide</div>
                    <div class="info long">${esc(s.desc)}<div class="detail"><strong>Cómo interpretarlo:</strong> ${esc(s.ref)}</div></div>
                  </div>
                  <div>
                    <div class="info-title">Escala orientativa</div>
                    <div class="info"><span class="range">${esc(rangeText(s))}</span></div>
                  </div>
                </div>
                <div class="advice">
                  <div class="info-title">Consejo para el tablero</div>
                  <div class="info">${esc(s.advice)}</div>
                </div>
              </article>
            `).join('');
            noResults.style.display = data.length ? 'none' : 'block';
            sensorCount.textContent = `Mostrando: ${data.length} de ${sensorsData.length} sensores`;
        }

        function applyFilters() {
            const q = normalize(searchInput.value).trim();
            const terms = q.split(/\s+/).filter(Boolean);

            const filtered = sensorsData.filter(s => {
                const originOK =
                    activeOriginFilter === 'all' ||
                    (activeOriginFilter === 'obd-basic' && isObdBasic(s)) ||
                    (activeOriginFilter === 'active-profile' && isActiveProfile(s));

                const categoryOK =
                    activeCategoryFilter === 'all' ||
                    normalize(s.cat) === normalize(activeCategoryFilter);

                const hay = normalize([
                    s.name, s.origin, s.unit, s.cat, s.desc, s.ref, s.advice, s.priority
                ].join(' '));

                const searchOK = terms.length === 0 || terms.every(t => hay.includes(t));
                return originOK && categoryOK && searchOK;
            });

            render(filtered);
            updateFilterSummary();
        }

        function updateFilterSummary() {
            const labels = [];
            if (activeOriginFilter === 'obd-basic') labels.push('OBD Básico');
            if (activeOriginFilter === 'active-profile') labels.push('Perfil Activo');
            if (activeCategoryFilter !== 'all') labels.push(activeCategoryFilter);
            if (searchInput.value.trim()) labels.push(`búsqueda: “${searchInput.value.trim()}”`);

            activeFilters.textContent = labels.length
                ? `Filtros activos: ${labels.join(' · ')}`
                : '';
            activeFilters.classList.toggle('visible', labels.length > 0);
        }

        function setActiveButton(selector, value) {
            document.querySelectorAll(selector).forEach(btn => {
                btn.classList.toggle('active', btn.dataset.filter === value);
            });
        }

        function buildCategoryFilters() {
            const counts = new Map();
            sensorsData.forEach(s => counts.set(s.cat, (counts.get(s.cat) || 0) + 1));
            const categories = [...counts.keys()].sort((a,b) =>
                a.localeCompare(b, 'es', { sensitivity:'base' })
            );

            categoryFilters.innerHTML = [
                '<button type="button" class="filter-btn active" data-filter="all">Todos</button>',
                ...categories.map(cat =>
                    `<button type="button" class="filter-btn" data-filter="${esc(cat)}">${esc(cat)} <span>(${counts.get(cat)})</span></button>`
                )
            ].join('');

            categoryFilters.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    activeCategoryFilter = btn.dataset.filter;
                    setActiveButton('#categoryFilters .filter-btn', activeCategoryFilter);
                    applyFilters();
                });
            });
        }

        document.querySelectorAll('.filter-row:first-child .filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                activeOriginFilter = btn.dataset.filter;
                setActiveButton('.filter-row:first-child .filter-btn', activeOriginFilter);
                applyFilters();
            });
        });

        searchInput.addEventListener('input', applyFilters);

        buildCategoryFilters();
        applyFilters();
    </script>
